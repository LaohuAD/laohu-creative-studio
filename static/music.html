<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>音乐创作</title>
    <script>
        (function(){try{
            var key='studio_theme_preference_v1', ids=['studio-violet','sunlit','vermilion','forest','classic'];
            var raw=localStorage.getItem(key), pref=null; try{pref=raw?JSON.parse(raw):null;}catch(e){}
            if(!pref||pref.version!==1||!['light','dark','system'].includes(pref.appearance)){
                var old=localStorage.getItem('studio_theme'), legacy=localStorage.getItem('canvas_theme');
                pref={version:1,themeId:'studio-violet',appearance:old==='dark'||old==='light'?old:legacy==='dark'||legacy==='light'?legacy:'light'};
                if(raw===null)localStorage.setItem(key,JSON.stringify(pref));
            }
            var theme=ids.includes(pref.themeId)?pref.themeId:'studio-violet';
            var mode=['light','dark','system'].includes(pref.appearance)?pref.appearance:'light';
            var appearance=mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':mode==='system'?'light':mode;
            document.documentElement.dataset.studioTheme=theme;document.documentElement.dataset.studioAppearance=appearance;document.documentElement.dataset.studioAppearanceMode=mode;
            document.documentElement.style.colorScheme=appearance;document.documentElement.classList.toggle('studio-theme-dark',appearance==='dark');document.documentElement.classList.toggle('theme-dark',appearance==='dark');
        }catch(e){}})();
    </script>
    <script src="/static/vendor/js/lucide.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js"></script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/studio-ui-polish.css">
    <link rel="stylesheet" href="/static/css/studio-theme-palettes.css">
    <link rel="stylesheet" href="/static/css/studio-music.css">
</head>
<body>
    <div class="music-app">
        <header class="music-toolbar">
            <div class="music-project-heading"><span class="music-kicker" id="musicKicker">音乐创作</span><h1 id="musicProjectName">正在读取作品…</h1></div>
            <div class="music-toolbar-actions">
                <button id="musicRefreshButton" class="music-icon-button compact" type="button" title="重新读取" aria-label="重新读取"><i data-lucide="refresh-cw" aria-hidden="true"></i></button>
                <button id="musicLanguageButton" class="music-icon-button compact" type="button" title="切换语言" aria-label="切换语言">中</button>
                <button id="musicThemeButton" class="music-icon-button compact" type="button" title="切换主题" aria-label="切换主题"><i data-lucide="sun-moon" aria-hidden="true"></i></button>
            </div>
        </header>

        <main class="music-main">
            <section id="musicStatus" class="music-status" role="status" aria-live="polite" hidden></section>
            <div class="music-layout">
                <div class="music-content-column">


                    <section class="music-panel music-work-panel" aria-label="歌曲内容">
                        <div class="music-edit-status"><span id="musicSaveStatus" role="status" aria-live="polite"></span><button id="musicSaveRetry" type="button" class="music-secondary-button" hidden>重试保存</button></div><div class="music-tabs" role="tablist" aria-label="歌曲内容分类">
                            <button id="musicTabLyrics" class="music-tab active" role="tab" type="button" aria-selected="true" aria-controls="musicPanelLyrics" data-music-tab="lyrics"><i data-lucide="align-left" aria-hidden="true"></i><span>歌词</span></button>
                            <button id="musicTabStyle" class="music-tab" role="tab" type="button" aria-selected="false" aria-controls="musicPanelStyle" data-music-tab="style"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span>风格提示词</span></button>
                            <button id="musicTabScores" class="music-tab" role="tab" type="button" aria-selected="false" aria-controls="musicPanelScores" data-music-tab="scores"><i data-lucide="music-2" aria-hidden="true"></i><span>乐谱</span><b id="musicScoreCount" class="music-tab-count">0</b></button>
                            <button id="musicTabNotes" class="music-tab" role="tab" type="button" aria-selected="false" aria-controls="musicPanelNotes" data-music-tab="notes"><i data-lucide="sticky-note" aria-hidden="true"></i><span>创作备注</span></button>
                        </div>
                        <section id="musicPanelLyrics" class="music-tab-panel" role="tabpanel" aria-labelledby="musicTabLyrics">
                            <div class="music-text-block"><div class="music-field-label"><i data-lucide="quote" aria-hidden="true"></i><h3 id="musicLyricsLabel">歌词</h3><button type="button" class="music-icon-button compact music-copy" data-copy="musicLyrics" aria-label="复制" title="复制"><i data-lucide="copy" aria-hidden="true"></i></button></div><textarea id="musicLyrics" class="music-editor" data-edit-field="lyrics" aria-label="lyrics" spellcheck="false"></textarea></div>
                        </section>
                        <section id="musicPanelStyle" class="music-tab-panel" role="tabpanel" aria-labelledby="musicTabStyle" hidden>
                            <div class="music-text-block"><div class="music-field-label"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><h3 id="musicStyleLabel">风格与编曲</h3><button type="button" class="music-icon-button compact music-copy" data-copy="musicStyle" aria-label="复制" title="复制"><i data-lucide="copy" aria-hidden="true"></i></button></div><textarea id="musicStyle" class="music-editor" data-edit-field="style_prompt" aria-label="style_prompt" spellcheck="false"></textarea></div>
                        </section>
                        <section id="musicPanelScores" class="music-tab-panel" role="tabpanel" aria-labelledby="musicTabScores" hidden>
                            <div class="music-score-layout"><nav id="musicScoreList" class="music-score-list" aria-label="乐谱文件"></nav><article id="musicScoreViewer" class="music-score-viewer"><div class="music-empty-inline">暂时没有乐谱文件</div></article></div>
                        </section>
                        <section id="musicPanelNotes" class="music-tab-panel" role="tabpanel" aria-labelledby="musicTabNotes" hidden>
                            <div class="music-text-block"><div class="music-field-label"><i data-lucide="notebook-pen" aria-hidden="true"></i><h3 id="musicNotesLabel">创作备注</h3><button type="button" class="music-icon-button compact music-copy" data-copy="musicNotes" aria-label="复制" title="复制"><i data-lucide="copy" aria-hidden="true"></i></button></div><textarea id="musicNotes" class="music-editor" data-edit-field="notes" aria-label="notes" spellcheck="false"></textarea></div>
                            <div id="musicReferencesBlock" class="music-reference-block" hidden><h3 id="musicReferencesLabel">参考音频</h3><div id="musicReferences" class="music-reference-list"></div></div>
                        </section>
                    </section>
                </div>

                <aside class="music-side-column">
                    <section class="music-panel music-title-panel" aria-labelledby="musicTitleHeading">
                        <div class="music-panel-heading"><div><h2 id="musicTitleHeading">歌曲</h2></div><span id="musicUpdatedAt" class="music-muted"></span></div>
                        <input id="musicCurrentTitle" class="music-title-input" data-edit-field="title" aria-label="歌曲标题" maxlength="240" autocomplete="off">
                        <details><summary data-label="titleHistory">标题历史</summary><div id="musicTitleChoices" class="music-title-choices"></div></details>
                    </section>
                    <section class="music-panel music-audio-panel" aria-labelledby="musicAudioHeading">
                        <div class="music-panel-heading"><div><h2 id="musicAudioHeading">音频结果</h2></div><span id="musicAudioCount" class="music-count-pill">0</span></div>
                        <div id="musicAudioState" class="music-empty-state"></div>
                        <div id="musicAudioList" class="music-audio-list"></div>
                    </section>
                    <section class="music-panel music-cover-panel" aria-labelledby="musicCoverHeading">
                        <div class="music-panel-heading"><div><h2 id="musicCoverHeading">封面</h2></div><span id="musicCoverCount" class="music-count-pill">0</span></div>
                        <div id="musicCoverState" class="music-empty-state"></div>
                        <div id="musicCoverList" class="music-cover-list"></div>
                    </section>
                    <section class="music-panel"><h2 id="musicHistoryHeading">歌词历史</h2><div id="musicContentHistory" class="music-title-choices"></div></section>
                    <details class="music-panel"><summary data-label="tasks">任务记录</summary><div id="musicTaskHistory"></div></details>
                </aside>
            </div>
        </main>
    </div>

    <div id="musicMiniPlayer" class="music-mini-player" hidden>
        <button id="musicMiniToggle" class="music-player-toggle" type="button" aria-label="播放"><i data-lucide="play" aria-hidden="true"></i></button>
        <div class="music-mini-copy"><strong id="musicMiniTitle"></strong><span id="musicMiniMeta"></span></div>
        <div class="music-mini-time"><span id="musicMiniCurrent">0:00</span><input id="musicMiniSeek" type="range" min="0" max="1000" value="0" aria-label="音频进度"><span id="musicMiniDuration">0:00</span></div>
        <button id="musicOpenPlayer" class="music-icon-button compact" type="button" aria-label="展开播放器"><i data-lucide="maximize-2" aria-hidden="true"></i></button>
        <audio id="musicAudioElement" preload="metadata"></audio>
    </div>

    <dialog id="musicPlayerDialog" class="music-player-dialog" aria-labelledby="musicPlayerDialogTitle">
        <div class="music-player-dialog-head"><div><span class="music-section-index">LISTENING</span><h2 id="musicPlayerDialogTitle">正在播放</h2></div><button id="musicPlayerClose" class="music-icon-button compact" type="button" aria-label="关闭播放器"><i data-lucide="x" aria-hidden="true"></i></button></div>
        <div class="music-player-art"><i data-lucide="audio-lines" aria-hidden="true"></i></div>
        <h3 id="musicPlayerTrackTitle"></h3><p id="musicPlayerTrackMeta"></p>
        <div id="musicTimedLyrics" class="music-timed-lyrics"><span>暂无同步歌词</span></div>
        <div class="music-expanded-controls"><button id="musicExpandedToggle" class="music-player-toggle large" type="button" aria-label="播放"><i data-lucide="play" aria-hidden="true"></i></button><span id="musicExpandedCurrent">0:00</span><input id="musicExpandedSeek" type="range" min="0" max="1000" value="0" aria-label="音频进度"><span id="musicExpandedDuration">0:00</span></div>
    </dialog>

    <dialog id="musicConflictDialog" class="music-player-dialog"><h2 id="musicConflictHeading">内容冲突</h2><div class="music-conflict-columns"><label><span id="musicMineLabel">我的草稿</span><textarea id="musicConflictMine" readonly></textarea></label><label><span id="musicLatestLabel">最新保存</span><textarea id="musicConflictLatest" readonly></textarea></label></div><div class="music-dialog-actions"><button id="musicKeepMine" type="button" class="music-primary-button">保留我的修改</button><button id="musicUseLatest" type="button" class="music-secondary-button">采用最新内容</button><button id="musicConflictClose" type="button" class="music-secondary-button">稍后处理</button></div></dialog>
    <dialog id="musicCoverPreview" class="music-player-dialog"><button type="button" id="musicCoverClose" class="music-icon-button compact" aria-label="关闭"><i data-lucide="x"></i></button><img id="musicCoverFull" alt="封面" style="width:100%;height:auto"></dialog>
    <script src="/static/js/studio-music.js"></script>
</body>
</html>
