<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <script>
        // 修复早期项目入口误指向列表的地址，已打开的标签刷新后也能进入原项目。
        const legacyProjectId = new URLSearchParams(location.search).get('id');
        if(legacyProjectId) location.replace('/static/hypit.html?id=' + encodeURIComponent(legacyProjectId));
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>Hypit</title>
    <script>
        (function(){
            try {
                var preferenceKey='studio_theme_preference_v1';
                var knownThemeIds=['studio-violet','sunlit','vermilion','forest','classic'];
                var saved=localStorage.getItem(preferenceKey), preference=null;
                try { preference=saved?JSON.parse(saved):null; } catch(e) {}
                var valid=preference && preference.version===1 && ['light','dark','system'].includes(preference.appearance);
                if(!valid) {
                    var old=localStorage.getItem('studio_theme'), legacy=localStorage.getItem('canvas_theme');
                    var appearance=old==='dark'||old==='light'?old:legacy==='dark'||legacy==='light'?legacy:'light';
                    preference={version:1,themeId:'studio-violet',appearance:appearance};
                    if(saved===null) { try { localStorage.setItem(preferenceKey,JSON.stringify(preference)); } catch(e) {} }
                }
                var themeId=knownThemeIds.includes(preference.themeId)?preference.themeId:'studio-violet';
                var mode=['light','dark','system'].includes(preference.appearance)?preference.appearance:'light';
                var theme=mode==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):mode;
                var root=document.documentElement;
                root.dataset.studioTheme=themeId; root.dataset.studioAppearance=theme; root.dataset.studioAppearanceMode=mode;
                root.style.colorScheme=theme;
                root.classList.toggle('studio-theme-dark',theme==='dark'); root.classList.toggle('theme-dark',theme==='dark');

            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.08.17.1786430759"></script>
    <script src="/static/js/theme.js?v=2026.10.04.theme-1"></script>
    <script src="/static/js/i18n.js?v=2026.08.17.1787068901"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.17.1786430759">
    <link rel="stylesheet" href="/static/css/studio-ui-polish.css?v=2026.08.17.1787804426">
    <link rel="stylesheet" href="/static/css/studio-projects.css?v=2026.09.19.1">
    <link rel="stylesheet" href="/static/css/studio-theme-palettes.css?v=2026.10.04.theme-1">
</head>
<body data-studio-module="hypit">
    <div class="studio-project-page">
        <main class="studio-project-main">
            <section class="studio-project-toolbar" aria-labelledby="studioProjectListTitle">
                <div class="studio-project-toolbar-top">
                    <div class="studio-project-toolbar-heading">
                        <h2 id="studioProjectListTitle">Hypit 项目</h2>
                        <p id="studioProjectDescription" class="studio-project-description">管理视频复刻项目，连接外部 Agent，并查看制作内容与结果。</p>
                    </div>
                    <div class="studio-project-toolbar-actions">
                        <label class="studio-search-field" for="studioProjectSearch">
                            <i data-lucide="search" aria-hidden="true"></i>
                            <input id="studioProjectSearch" type="search" autocomplete="off" placeholder="搜索项目" aria-label="搜索项目">
                        </label>
                        <button id="studioPrepareButton" class="studio-secondary-button" type="button">
                            <i data-lucide="book-open-check" aria-hidden="true"></i><span>准备创作技能</span>
                        </button>
                        <button id="studioNewProjectButton" class="studio-primary-button" type="button">
                            <i data-lucide="plus" aria-hidden="true"></i><span>新建项目</span>
                        </button>
                    </div>
                </div>
            </section>

            <section id="studioProjectState" class="studio-project-state" aria-live="polite">
                <div class="studio-state-icon"><i data-lucide="loader-circle" aria-hidden="true"></i></div>
                <strong>正在读取项目</strong>
                <span>项目记录来自服务端，列表不会以临时页面状态代替保存。</span>
            </section>
            <section id="studioProjectGrid" class="studio-project-grid" aria-live="polite"></section>
        </main>

        <div id="studioOpenFallback" class="studio-open-fallback" hidden>
            <div class="studio-open-fallback-panel" role="status">
                <div class="studio-state-icon"><i data-lucide="external-link" aria-hidden="true"></i></div>
                <div>
                    <strong id="studioOpenFallbackTitle">浏览器拦截了新标签</strong>
                    <p id="studioOpenFallbackText">点击下面的按钮打开项目。</p>
                </div>
                <div class="studio-open-fallback-actions">
                    <button id="studioOpenFallbackButton" class="studio-primary-button" type="button">打开项目</button>
                    <button id="studioOpenFallbackClose" class="studio-secondary-button" type="button">关闭</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/studio-projects.js?v=2026.09.19.1"></script>
</body>
</html>
