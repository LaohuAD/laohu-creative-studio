<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>素材库管理</title>
    <script>
        (function(){
            try {
                var preferenceKey='studio_theme_preference_v1';
                var knownThemeIds=['studio-violet','sunlit','vermilion','forest','classic'];
                var saved=localStorage.getItem(preferenceKey), preference=null;
                try { preference=saved?JSON.parse(saved):null; } catch(e) {}
                var valid=preference && preference.version===1 && ['light','dark','system'].includes(preference.appearance);
                if(!valid) {
                    var old=localStorage.getItem('studio_theme'), legacy=localStorage.getItem('canvas_theme');
                    var appearance=old==='dark'||old==='light'?old:legacy==='dark'||legacy==='light'?legacy:'light';
                    preference={version:1,themeId:'studio-violet',appearance:appearance};
                    if(saved===null) { try { localStorage.setItem(preferenceKey,JSON.stringify(preference)); } catch(e) {} }
                }
                var themeId=knownThemeIds.includes(preference.themeId)?preference.themeId:'studio-violet';
                var mode=['light','dark','system'].includes(preference.appearance)?preference.appearance:'light';
                var theme=mode==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):mode;
                var root=document.documentElement;
                root.dataset.studioTheme=themeId; root.dataset.studioAppearance=theme; root.dataset.studioAppearanceMode=mode;
                root.style.colorScheme=theme;
                root.classList.toggle('studio-theme-dark',theme==='dark'); root.classList.toggle('theme-dark',theme==='dark');

            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.08.17.1786430759"></script>
    <script src="/static/js/theme.js?v=2026.10.04.theme-1"></script>
    <script src="/static/js/i18n.js?v=2026.08.17.1787068901"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.17.1786430759">
    <link rel="stylesheet" href="/static/css/asset-manager.css?v=2026.08.17.1787026638">
    <link rel="stylesheet" href="/static/css/studio-ui-polish.css?v=2026.08.17.1787804426">
    <link rel="stylesheet" href="/static/css/studio-theme-palettes.css?v=2026.10.04.theme-1">
</head>
<body>
    <div class="asset-page">
        <header class="asset-page-head">
            <div>
                <div class="asset-title">素材库管理</div>
                <div class="asset-sub">按库、分组、内容和预览管理素材与提示词。</div>
            </div>
            <div class="asset-head-actions">
                <div id="assetStatus" class="asset-status">准备就绪</div>
                <button id="refreshBtn" class="asset-btn" type="button"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
            </div>
        </header>

        <div class="asset-tabs">
            <button id="assetTabAssets" class="active" type="button" data-tab="assets"><i data-lucide="library"></i><span data-i18n="asset.inputMaterials">输入素材</span></button>
            <button id="assetTabWorkflows" type="button" data-tab="workflows"><i data-lucide="workflow"></i><span data-i18n="asset.canvasWorkflows">画布工作流</span></button>
            <button id="assetTabPrompts" type="button" data-tab="prompts"><i data-lucide="text-cursor-input"></i><span data-i18n="asset.promptLibrary">提示词库</span></button>
            <button id="assetTabResults" type="button" data-tab="results"><i data-lucide="sparkles"></i><span data-i18n="asset.generationResults">生成结果</span></button>
        </div>

        <main id="assetManagerRoot" class="asset-manager-root"></main>
    </div>

    <input id="assetUploadInput" type="file" accept="image/*,video/*,audio/*,.json,.zip,application/json,application/zip" multiple hidden>
    <script src="/static/js/media-ui.js"></script>
    <script src="/static/js/material-promote.js?v=2026.08.17.1786546376"></script>
    <script src="/static/js/asset-manager.js?v=2026.08.17.1787105532"></script>
</body>
</html>
