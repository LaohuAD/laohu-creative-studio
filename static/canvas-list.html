<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>画布</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.08.17.1786430759"></script>
    <script src="/static/js/theme.js?v=2026.08.17.1786430759"></script>
    <script src="/static/js/i18n.js?v=2026.08.17.1787068901"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.17.1786430759">
    <link rel="stylesheet" href="/static/css/studio-ui-polish.css?v=2026.08.17.1787804426">
    <link rel="stylesheet" href="/static/css/studio-projects.css?v=2026.09.19.1">
</head>
<body data-studio-module="canvas">
    <div class="studio-project-page">
        <main class="studio-project-main">
            <section class="studio-project-toolbar" aria-labelledby="studioProjectListTitle">
                <div>
                    <h2 id="studioProjectListTitle">画布项目</h2>
                    <p id="studioProjectCount" class="studio-project-count">正在读取...</p>
                </div>
                <div class="studio-project-toolbar-actions">
                    <label class="studio-search-field" for="studioProjectSearch">
                        <i data-lucide="search" aria-hidden="true"></i>
                        <input id="studioProjectSearch" type="search" autocomplete="off" placeholder="搜索项目" aria-label="搜索项目">
                    </label>
                    <button id="studioNewProjectButton" class="studio-primary-button" type="button">
                        <i data-lucide="plus" aria-hidden="true"></i><span>新建项目</span>
                    </button>
                </div>
            </section>

            <section id="studioCanvasTools" class="studio-legacy-tools">
                <div class="studio-legacy-copy">
                    <div class="studio-section-kicker" data-copy="canvasTools">画布工具</div>
                    <strong data-copy="canvasToolsTitle">导入工程与回收站</strong>
                    <span data-copy="canvasToolsHint">导入与导出使用同一套工程 ZIP 结构；打开画布后可在工作流工具中导入工程，删除的画布可从回收站恢复。</span>
                </div>
                <div class="studio-legacy-actions">
                    <button id="studioImportGuide" class="studio-secondary-button" type="button"><i data-lucide="file-input" aria-hidden="true"></i><span>导入工程</span></button>
                    <button id="studioTrashButton" class="studio-secondary-button" type="button"><i data-lucide="trash-2" aria-hidden="true"></i><span>回收站</span><b id="studioTrashBadge" hidden>0</b></button>
                </div>
            </section>

            <section id="studioProjectState" class="studio-project-state" aria-live="polite">
                <div class="studio-state-icon"><i data-lucide="loader-circle" aria-hidden="true"></i></div>
                <strong>正在读取项目</strong>
                <span>项目记录来自服务端，列表不会以临时页面状态代替保存。</span>
            </section>
            <section id="studioProjectGrid" class="studio-project-grid" aria-live="polite"></section>

        </main>

        <div id="studioOpenFallback" class="studio-open-fallback" hidden>
            <div class="studio-open-fallback-panel" role="status">
                <div class="studio-state-icon"><i data-lucide="external-link" aria-hidden="true"></i></div>
                <div>
                    <strong id="studioOpenFallbackTitle">浏览器拦截了新标签</strong>
                    <p id="studioOpenFallbackText">点击下面的按钮打开项目。</p>
                </div>
                <div class="studio-open-fallback-actions">
                    <button id="studioOpenFallbackButton" class="studio-primary-button" type="button">打开项目</button>
                    <button id="studioOpenFallbackClose" class="studio-secondary-button" type="button">关闭</button>
                </div>
            </div>
        </div>

        <div id="studioTrashPanel" class="studio-trash-panel" hidden>
            <div class="studio-trash-panel-head">
                <div>
                    <div class="studio-section-kicker" data-copy="trashKicker">画布回收站</div>
                    <strong data-copy="trashTitle">可恢复的画布</strong>
                </div>
                <button id="studioTrashClose" class="studio-quiet-button" type="button" title="关闭回收站" aria-label="关闭回收站"><i data-lucide="x" aria-hidden="true"></i></button>
            </div>
            <div id="studioTrashList" class="studio-trash-list"></div>
        </div>
    </div>
    <script src="/static/js/studio-projects.js?v=2026.09.19.1"></script>
</body>
</html>
