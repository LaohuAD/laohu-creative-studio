<!doctype html>
<html lang="zh-CN" data-studio-scale="off">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hypit | 老胡画梦枋</title>
  <script>
        (function(){
            try {
                var preferenceKey='studio_theme_preference_v1';
                var knownThemeIds=['studio-violet','sunlit','vermilion','forest','classic'];
                var saved=localStorage.getItem(preferenceKey), preference=null;
                try { preference=saved?JSON.parse(saved):null; } catch(e) {}
                var valid=preference && preference.version===1 && ['light','dark','system'].includes(preference.appearance);
                if(!valid) {
                    var old=localStorage.getItem('studio_theme'), legacy=localStorage.getItem('canvas_theme');
                    var appearance=old==='dark'||old==='light'?old:legacy==='dark'||legacy==='light'?legacy:'light';
                    preference={version:1,themeId:'studio-violet',appearance:appearance};
                    if(saved===null) { try { localStorage.setItem(preferenceKey,JSON.stringify(preference)); } catch(e) {} }
                }
                var themeId=knownThemeIds.includes(preference.themeId)?preference.themeId:'studio-violet';
                var mode=['light','dark','system'].includes(preference.appearance)?preference.appearance:'light';
                var theme=mode==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):mode;
                var root=document.documentElement;
                root.dataset.studioTheme=themeId; root.dataset.studioAppearance=theme; root.dataset.studioAppearanceMode=mode;
                root.style.colorScheme=theme;
                root.classList.toggle('studio-theme-dark',theme==='dark'); root.classList.toggle('theme-dark',theme==='dark');

            } catch(e) {}
        })();
    </script>
  <script src="/static/js/theme.js"></script><script src="/static/js/i18n.js"></script>
  <link rel="stylesheet" href="/static/css/theme.css"><link rel="stylesheet" href="/static/css/studio-projects.css">
  <style>
    body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
    .hypit-header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--sp-line);background:var(--sp-surface);flex-wrap:wrap}
    .hypit-heading{margin-right:auto;min-width:120px}.hypit-heading strong{display:block;font-size:17px}.hypit-heading span{color:var(--sp-muted);font-size:12px}
    .hypit-header button,.hypit-header select{height:36px;padding:0 12px;border:1px solid var(--sp-line);border-radius:8px;background:var(--sp-card);color:var(--sp-text);font:inherit;font-size:13px}
    .hypit-header select{max-width:240px}.hypit-header button:hover{background:var(--sp-soft)}
    #nativeStudio{width:100%;flex:1;border:0;background:var(--sp-page)}
    #empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:14px;text-align:center}
    #empty h1{font-size:24px;margin:0}#empty p{max-width:560px;color:var(--sp-muted);line-height:1.8;margin:0}#status{font-size:13px;color:var(--sp-muted)}
    @media(max-width:650px){.hypit-header{gap:8px;padding:12px}.hypit-heading{width:100%}.hypit-header select{max-width:150px}}
  </style>
    <link rel="stylesheet" href="/static/css/studio-theme-palettes.css?v=2026.10.04.theme-1">
</head>
<body>
  <header class="hypit-header">
    <div class="hypit-heading"><strong>Hypit</strong><span id="projectName"></span></div>
    <a id="back" href="/static/hypit-list.html"></a><select id="run" aria-label="制作方案" hidden></select><button id="refresh" type="button"></button>

  <iframe id="nativeStudio" title="Hypit Studio / 老胡画梦枋" hidden allow="fullscreen; clipboard-write"></iframe>
  <script src="/static/js/hypit-project.js"></script>
</body>
</html>
